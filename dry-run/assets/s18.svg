<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title"><title id="title">Virtual-thread tasks pass through a bounded concurrency gate</title><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007F86"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B66A00"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5D6B7B"/></marker></defs><rect width="720" height="480" fill="#F5F7FA"/><text x="360" y="57" text-anchor="middle" font-family="Arial" font-size="34" font-weight="600" fill="#14263D">Virtual thread concurrency</text><rect x="45" y="130" width="180" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><g transform="translate(135 187) scale(0.95)" fill="none" stroke="#007F86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M-32,-25 H7 Q28,-25 28,-7 H-9 Q-29,-7 -29,11 H13 Q32,11 32,29 H-32"/></g><text x="135" y="270" text-anchor="middle" font-family="Arial" font-size="32" font-weight="600" fill="#14263D">Tasks</text><text x="135" y="322" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#5D6B7B">Queued</text><path d="M235,245 L290,245" fill="none" stroke="#007F86" stroke-width="5" stroke-linecap="round" marker-end="url(#teal)" /><rect x="310" y="130" width="150" height="230" rx="20" fill="#FFF2DF" stroke="#B66A00" stroke-width="3" /><g transform="translate(385 207) scale(1)" fill="none" stroke="#007F86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M-30,35 V-35 H30 V35 M-15,-23 V24 M0,-23 V24 M15,-23 V24"/></g><text x="385" y="320" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#B66A00">Bounded</text><path d="M470,245 L515,245" fill="none" stroke="#007F86" stroke-width="5" stroke-linecap="round" marker-end="url(#teal)" /><rect x="535" y="130" width="140" height="230" rx="20" fill="#FFFFFF" stroke="#007F86" stroke-width="3" /><g transform="translate(605 207) scale(1)" fill="none" stroke="#007F86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M-38,-24 H38 V27 H-38 Z M-25,-10 H-6 V13 H-25 Z M6,-10 H25 V13 H6 Z M-30,36 H30"/></g><text x="605" y="320" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Active</text><text x="360" y="429" text-anchor="middle" font-family="Arial" font-size="30" font-weight="400" fill="#5D6B7B">Concurrency gate controls entry</text></svg>