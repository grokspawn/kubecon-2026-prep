<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title"><title id="title">Operator author and user agree through config and schema; validated configuration drives Deployment</title><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007F86"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B66A00"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5D6B7B"/></marker></defs><rect width="720" height="480" fill="#F5F7FA"/><text x="360" y="57" text-anchor="middle" font-family="Arial" font-size="34" font-weight="600" fill="#14263D">Configuration contract</text><rect x="30" y="100" width="290" height="100" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><text x="175" y="138" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Operator author</text><text x="175" y="180" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Config contract</text><rect x="400" y="100" width="290" height="100" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><text x="545" y="138" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">User</text><text x="545" y="180" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Requirements</text><rect x="230" y="245" width="260" height="80" rx="20" fill="#E4F2F2" stroke="#007F86" stroke-width="3" /><text x="360" y="278" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Config / schema</text><text x="360" y="313" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Validated</text><path d="M175,200 V285 H220" fill="none" stroke="#007F86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" /><path d="M230,265 H205 V210 H175" fill="none" stroke="#007F86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" /><path d="M545,200 V285 H500" fill="none" stroke="#007F86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" /><path d="M490,265 H515 V210 H545" fill="none" stroke="#007F86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" /><path d="M360,330 L360,365" fill="none" stroke="#007F86" stroke-width="5" stroke-linecap="round" marker-end="url(#teal)" /><rect x="230" y="375" width="260" height="60" rx="20" fill="#FFFFFF" stroke="#007F86" stroke-width="3" /><text x="360" y="416" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Deployment</text></svg>