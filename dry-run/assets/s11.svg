<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title"><title id="title">FBC to v2 schemas: shared metadata reduces repetition and registry+v1 and helm+v2 provide typed content</title><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007F86"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B66A00"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5D6B7B"/></marker></defs><rect width="720" height="480" fill="#F5F7FA"/><text x="360" y="57" text-anchor="middle" font-family="Arial" font-size="34" font-weight="600" fill="#14263D">Catalog schema structure</text><rect x="205" y="125" width="310" height="85" rx="20" fill="#E4F2F2" stroke="#007F86" stroke-width="3" /><text x="360" y="180" text-anchor="middle" font-family="Arial" font-size="32" font-weight="600" fill="#14263D">Shared metadata</text><path d="M360,215 V235 H195 V260" fill="none" stroke="#007F86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" /><path d="M360,235 H525 V260" fill="none" stroke="#007F86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" /><rect x="45" y="275" width="300" height="95" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><text x="195" y="315" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">registry+v1</text><text x="195" y="353" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Version card</text><rect x="375" y="275" width="300" height="95" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><text x="525" y="315" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">helm+v2</text><text x="525" y="353" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Version card</text><text x="360" y="100" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#5D6B7B">Less repeated metadata</text><text x="360" y="408" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#5D6B7B">Typed content</text><text x="360" y="458" text-anchor="middle" font-family="Arial" font-size="30" font-weight="400" fill="#5D6B7B">FBC → v2 schemas</text></svg>