<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title"><title id="title">Informer sharing for compatible configurations and separate informers for incompatible configurations</title><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007F86"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B66A00"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5D6B7B"/></marker></defs><rect width="720" height="480" fill="#F5F7FA"/><text x="360" y="57" text-anchor="middle" font-family="Arial" font-size="34" font-weight="600" fill="#14263D">Informer sharing</text><rect x="35" y="105" width="390" height="300" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><text x="230" y="145" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">Compatible</text><rect x="60" y="165" width="150" height="115" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><g transform="translate(135 197) scale(0.6)" fill="none" stroke="#007F86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><circle r="25"/><circle r="9"/><path d="M0,-38 V-26 M0,26 V38 M-38,0 H-26 M26,0 H38 M-27,-27 L-18,-18 M18,18 L27,27 M27,-27 L18,-18 M-18,18 L-27,27"/></g><text x="135" y="258" text-anchor="middle" font-family="Arial" font-size="30" font-weight="600" fill="#14263D">A</text><rect x="250" y="165" width="150" height="115" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" /><g transform="translate(325 197) scale(0.6)" fill="none" stroke="#007F86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><circle r="25"/><circle r="9"/><path d="M0,-38 V-2